<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>My Tasks</h1>
    <p class="counter" id="counter">No tasks yet</p>

    <!-- Add task -->
    <form class="add-form" id="add-form">
      <input
        type="text"
        id="task-input"
        placeholder="What do you need to do?"
        maxlength="100"
        autocomplete="off"
        required
      />
      <button type="submit">Add task</button>
    </form>

    <!-- Filter buttons -->
    <div class="filters" id="filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="active">Pending</button>
      <button class="filter" data-filter="done">Done</button>
    </div>

    <!-- Task list (filled by script.js) -->
    <ul class="task-list" id="task-list"></ul>

    <p class="empty" id="empty" hidden>Nothing here. Add a task above.</p>

    <button class="clear" id="clear-done" hidden>Delete completed tasks</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
